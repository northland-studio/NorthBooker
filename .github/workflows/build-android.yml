name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.1.12297006" > /dev/null 2>&1 || true

      - name: Install dependencies
        working-directory: Android
        run: npm ci

      - name: Prepare release keystore (if secrets provided)
        working-directory: Android/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > northbooker-release.keystore
            echo "keystore ready"
          else
            echo "no release keystore, using debug signing"
          fi

      - name: Build release APK
        working-directory: Android/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Get version
        id: version
        working-directory: Android
        run: |
          echo "versionName=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "versionCode=$(grep -oP 'versionCode \K\d+' android/app/build.gradle | head -1)" >> $GITHUB_OUTPUT

      - name: Upload to Qiniu CDN (仅 CDN 分发)
        working-directory: Android
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          npm install qiniu
          node scripts/publish-to-cdn.js \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --versionName "${{ steps.version.outputs.versionName }}" \
            --versionCode "${{ steps.version.outputs.versionCode }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: northbooker-android
          path: Android/android/app/build/outputs/apk/release/*.apk
