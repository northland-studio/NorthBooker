name: Build Electron Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - '.github/workflows/build-electron.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Electron app (Windows)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Get version
        id: package
        working-directory: electron
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: northbooker-windows
          path: electron/dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          files: electron/dist/*.exe
          draft: false
          prerelease: false

      - name: Upload to Qiniu CDN (备用更新源)
        working-directory: electron
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          npm install qiniu
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          $yml = Get-ChildItem dist -Filter latest.yml | Select-Object -First 1
          $env:EXE_PATH = $exe.FullName
          $env:EXE_NAME = $exe.Name
          $env:YML_PATH = $yml.FullName
          node -e "
            const qiniu = require('qiniu')
            const fs = require('fs')
            const path = require('path')
            const mac = new qiniu.auth.digest.Mac(process.env.QINIU_ACCESS_KEY, process.env.QINIU_SECRET_KEY)
            const config = new qiniu.conf.Config()
            config.zone = qiniu.zone.Zone_as0
            const formUploader = new qiniu.form_up.FormUploader(config)
            const bucket = 'northbooker'
            function upload(localPath, key) {
              return new Promise((resolve, reject) => {
                const token = new qiniu.rs.PutPolicy({ scope: bucket + ':' + key }).uploadToken(mac)
                formUploader.putFile(token, key, localPath, null, (err, ret, info) => {
                  if (err) return reject(err)
                  if (info.statusCode === 200) { console.log('上传成功:', key); resolve(ret) }
                  else reject(new Error(info.statusCode + ' ' + JSON.stringify(ret)))
                })
              })
            }
            (async () => {
              await upload(process.env.EXE_PATH, 'releases/' + process.env.EXE_NAME)
              await upload(process.env.YML_PATH, 'releases/latest.yml')
              console.log('CDN 源部署完成')
            })()
          "
