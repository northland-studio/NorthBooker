name: Build Electron Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/build-electron.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend & copy to Electron
        run: |
          npm install
          npm run build
          if (Test-Path electron/renderer-dist) { Remove-Item -Recurse -Force electron/renderer-dist }
          Copy-Item -Recurse dist electron/renderer-dist

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build Electron app (Windows)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Get version
        id: package
        working-directory: electron
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: northbooker-windows
          path: electron/dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          files: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false

      - name: Upload to Qiniu CDN (备用更新源)
        working-directory: electron
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          npm install qiniu
          node -e "
            const qiniu = require('qiniu')
            const fs = require('fs')
            const path = require('path')
            const mac = new qiniu.auth.digest.Mac(process.env.QINIU_ACCESS_KEY, process.env.QINIU_SECRET_KEY)
            const config = new qiniu.conf.Config()
            config.zone = qiniu.zone.Zone_as0
            config.useHttpsDomain = true
            const formUploader = new qiniu.form_up.FormUploader(config)
            const bucket = 'northbooker'
            function upload(localPath, key) {
              return new Promise((resolve, reject) => {
                const token = new qiniu.rs.PutPolicy({ scope: bucket + ':' + key }).uploadToken(mac)
                formUploader.putFile(token, key, localPath, null, (err, ret, info) => {
                  if (err) return reject(err)
                  if (info.statusCode === 200) { console.log('上传成功:', key); resolve(ret) }
                  else reject(new Error(info.statusCode + ' ' + JSON.stringify(ret)))
                })
              })
            }
            (async () => {
              const distDir = path.join(__dirname, 'dist')
              // 列出 dist 中实际存在的文件
              const distFiles = fs.readdirSync(distDir)
              const exeFile = distFiles.find(f => f.endsWith('.exe'))
              const blockmapFile = distFiles.find(f => f.endsWith('.exe.blockmap'))
              const ymlContent = fs.readFileSync(path.join(distDir, 'latest.yml'), 'utf-8')

              // 从 latest.yml 解析文件名
              const re = /^\s*- url:\s*(.+)$/gm
              const ymlFiles = []
              let m
              while ((m = re.exec(ymlContent)) !== null) {
                ymlFiles.push(m[1].trim())
              }
              console.log('latest.yml 引用文件:', ymlFiles)

              // 上传 latest.yml
              await upload(path.join(distDir, 'latest.yml'), 'releases/latest.yml')

              // 上传 release-notes.json
              const notesPath = path.join(__dirname, 'release-notes.json')
              if (fs.existsSync(notesPath)) {
                await upload(notesPath, 'releases/release-notes.json')
                console.log('release-notes.json 已上传')
              }

              // 按 YAML 文件名上传（用实际磁盘文件的扩展名匹配）
              for (const ymlName of ymlFiles) {
                const ext = path.extname(ymlName)
                const actualFile = distFiles.find(f => path.extname(f) === ext && (f.endsWith('.exe') || f.endsWith('.blockmap')))
                if (actualFile) {
                  console.log('上传:', actualFile, '→ releases/' + ymlName)
                  await upload(path.join(distDir, actualFile), 'releases/' + ymlName)
                } else {
                  console.error('找不到匹配文件:', ymlName, 'dist内容:', distFiles)
                }
              }
              console.log('CDN 源部署完成')
            })()
          "
