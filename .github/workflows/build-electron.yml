name: Build Electron Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - '.github/workflows/build-electron.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Electron app (Windows)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Get version
        id: package
        working-directory: electron
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: northbooker-windows
          path: electron/dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          files: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false

      - name: Upload to Qiniu CDN (备用更新源)
        working-directory: electron
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          npm install qiniu
          node -e "
            const qiniu = require('qiniu')
            const fs = require('fs')
            const path = require('path')
            const mac = new qiniu.auth.digest.Mac(process.env.QINIU_ACCESS_KEY, process.env.QINIU_SECRET_KEY)
            const config = new qiniu.conf.Config()
            config.zone = qiniu.zone.Zone_as0
            config.useHttpsDomain = true
            const formUploader = new qiniu.form_up.FormUploader(config)
            const bucket = 'northbooker'
            function upload(localPath, key) {
              return new Promise((resolve, reject) => {
                const token = new qiniu.rs.PutPolicy({ scope: bucket + ':' + key }).uploadToken(mac)
                formUploader.putFile(token, key, localPath, null, (err, ret, info) => {
                  if (err) return reject(err)
                  if (info.statusCode === 200) { console.log('上传成功:', key); resolve(ret) }
                  else reject(new Error(info.statusCode + ' ' + JSON.stringify(ret)))
                })
              })
            }
            (async () => {
              // 从 latest.yml 解析文件名（匹配 electron-updater 预期的格式）
              const distDir = path.join(__dirname, 'dist')
              const ymlContent = fs.readFileSync(path.join(distDir, 'latest.yml'), 'utf-8')
              const fileNames = []
              const re = /^\s*- url:\s*(.+)$/gm
              let m
              while ((m = re.exec(ymlContent)) !== null) {
                fileNames.push(m[1].trim())
              }
              console.log('latest.yml 包含文件:', fileNames)
              // 上传 latest.yml
              await upload(path.join(distDir, 'latest.yml'), 'releases/latest.yml')
              // 上传所有 YAML 中引用的文件（用 YAML 中的文件名作为 key）
              for (const name of fileNames) {
                const localPath = path.join(distDir, name)
                if (!fs.existsSync(localPath)) {
                  console.error('文件不存在:', localPath)
                  continue
                }
                await upload(localPath, 'releases/' + name)
              }
              console.log('CDN 源部署完成')
            })()
          "
